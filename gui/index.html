<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>kgiit learn</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div id="titlebar">kgiit learn - <span id="track-title">Loading...</span></div>
  
  <div id="app-container">
    <div id="main-pane">
      <div id="lesson-pane">
        <h2 id="lesson-title">Lesson</h2>
        <div id="progress-container">
          <div id="progress-bar"></div>
        </div>
        <div id="lesson-prompt"></div>
      </div>
      
      <div id="terminal-pane">
        <div id="scrollback"></div>
        <div id="input-line">
          <span id="prompt-symbol">$</span>
          <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" placeholder="Type a git command...">
        </div>
      </div>
    </div>
    
    <div id="status-pane">
      <h3>Sandbox Status</h3>
      <div class="status-item">
        <div class="status-label">Branch</div>
        <div class="status-value" id="status-branch">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">Staged</div>
        <div class="status-value" id="status-staged">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">Unstaged</div>
        <div class="status-value" id="status-unstaged">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">Untracked</div>
        <div class="status-value" id="status-untracked">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">Last Commit</div>
        <div class="status-value" id="status-commit">-</div>
      </div>
      
      <div class="controls">
        <button id="btn-next" disabled>Next Lesson</button>
        <button id="btn-skip">Skip Lesson ⏭</button>
        <button id="btn-reset">Reset Lesson</button>
        <button id="btn-quit" style="margin-top:10px; background-color: var(--border-color); color: var(--text-color);">Switch Track (Quit)</button>
        <button id="btn-git-log" style="margin-top:10px; background-color: var(--border-color); color: var(--text-color);">View Git History</button>
      </div>
    </div>
  </div>

  <!-- Track Selection Modal -->
  <div id="track-modal" class="modal">
    <div class="modal-content">
      <h2>Select a Track</h2>
      <div id="track-list"></div>
      <button id="btn-close-modal" style="margin-top:15px; width:100%; background-color: var(--border-color); color: var(--text-color);">Cancel</button>
    </div>
  </div>

  <!-- Git Log Modal -->
  <div id="git-log-modal" class="modal">
    <div class="modal-content" style="max-width: 800px; width: 90%; max-height: 80vh; display: flex; flex-direction: column;">
      <h2>Git History Viewer</h2>
      <div style="margin-bottom: 10px; display: flex; gap: 10px;">
        <button id="btn-select-repo" style="flex: 1;">Select Repository Folder</button>
      </div>
      <div id="git-log-path" style="font-size: 0.85em; color: var(--text-color); margin-bottom: 15px; word-break: break-all;"></div>
      
      <div id="git-log-content" style="flex: 1; overflow-y: auto; background-color: #0d1117; border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; margin-bottom: 15px;">
        <div id="git-log-loading" style="display: none; text-align: center; padding: 20px;">Loading commits...</div>
        <div id="git-log-error" style="display: none; color: #ff7b72; padding: 20px;"></div>
        <div id="git-log-empty" style="display: none; text-align: center; padding: 20px; color: #8b949e;">No commits found in this repository.</div>
        <table id="git-log-table" style="width: 100%; border-collapse: collapse; font-size: 0.9em; display: none;">
          <thead style="border-bottom: 1px solid var(--border-color); text-align: left;">
            <tr>
              <th style="padding: 8px;">Hash</th>
              <th style="padding: 8px;">Refs</th>
              <th style="padding: 8px;">Message</th>
              <th style="padding: 8px;">Author</th>
              <th style="padding: 8px;">Date</th>
            </tr>
          </thead>
          <tbody id="git-log-tbody"></tbody>
        </table>
      </div>
      <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button id="btn-load-more" style="display: none; flex: 1;">Load More</button>
      </div>
      <button id="btn-close-log-modal" style="width:100%; background-color: var(--border-color); color: var(--text-color);">Close Viewer</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
