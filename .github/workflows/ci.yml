name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Configure git for sandbox tests
        run: |
          git config --global user.email "ci@kgiit.test"
          git config --global user.name "kgiit CI"
          git config --global init.defaultBranch main

      - name: Run full test suite
        run: pytest tests/ -v --tb=short --ignore=tests/test_sandbox.py

      - name: Run sandbox tests (with git available)
        run: pytest tests/test_sandbox.py -v --tb=short

      - name: Run skill contract tests
        run: pytest tests/test_skill_contract.py -v

      - name: Run ML classifier tests
        run: pytest tests/test_ml_classifier.py -v

      - name: Verify CLI entry point works
        run: kgiit --help

      - name: Verify triage subcommand help
        run: kgiit triage --help

      - name: Verify learn subcommand help
        run: kgiit learn --help

      - name: Headless learn smoke test
        run: kgiit learn --headless
        timeout-minutes: 2
        continue-on-error: true  # TUI headless may not work in all CI envs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: |
          flake8 kgiit/ --max-line-length=110 \
            --extend-ignore=E203,W503,E501 \
            --exclude=kgiit/learn/ml/model.joblib
