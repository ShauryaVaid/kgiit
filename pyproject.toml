[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kgiit"
version = "1.2.0"
description = "Two doors, one CLI: analyze real GitHub issues + learn git in an offline sandbox."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    { name = "Shaurya Vaid" }
]
keywords = ["git", "github", "analyze", "learn", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
kgiit = "kgiit.cli:main"

[project.urls]
Homepage = "https://github.com/ShauryaVaid/kgiit"
Repository = "https://github.com/ShauryaVaid/kgiit"

[tool.setuptools.packages.find]
where = ["."]
include = ["kgiit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
