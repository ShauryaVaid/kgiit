[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triagectl"
version = "0.1.0"
description = "A Python CLI tool for managing and automated triage workflows."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    { name = "Developer" }
]
dependencies = [
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.scripts]
triage = "triagectl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
